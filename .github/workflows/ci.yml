name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # A real Postgres, not sqlite-in-memory: this project uses Postgres-only
    # features (JSONB, native UUID, CHECK constraints checked at the
    # DB level) that sqlite would silently accept and mis-validate. A
    # service container gives CI the same database engine as prod for the
    # cost of one extra `services:` block.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ldip
          POSTGRES_PASSWORD: ldip
          POSTGRES_DB: ldip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ldip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql+psycopg2://ldip:ldip@localhost:5432/ldip_test
      DATABASE_URL: postgresql+psycopg2://ldip:ldip@localhost:5432/ldip_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      # Same system deps as docker/Dockerfile — pdf2image/pytesseract need
      # the poppler/tesseract binaries, which pip cannot install.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Verify Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t ldip-app:ci .
